# gitleaks configuration: the default rules, plus the two invented tokens the tests use.
# Each exception names its file AND its exact value, so a real secret in the same file, or the
# same value anywhere else, is still reported.
title = "Kelvin"

[extend]
useDefault = true

[[allowlists]]
description = "Invented MyElectricalData token in the Linky client tests"
condition = "AND"
paths = ['''^backend/tests/test_linky_med\.py$''']
regexes = ['''^tok-secret-0123456789$''']

[[allowlists]]
description = "Invented Linky token in the web API client tests"
condition = "AND"
paths = ['''^web/src/lib/api/client\.test\.ts$''']
regexes = ['''^tok-123456789$''']
