name: CodeQL

# GitHub's code scanning on the backend (Python), the web app (TypeScript, Svelte's scripts) and
# the workflows themselves: on pull requests, on pushes to main (the baseline pull requests are
# compared with) and once a week, so a new query finds old code too. The results go to the
# repository's Security tab. Source-only analysis (build-mode: none): no build, no dependency
# install, nothing from PyPI or npm runs in these jobs. This workflow replaces GitHub's "default
# setup", which must be off for it to upload (the two cannot both run).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 05:23 UTC.
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A new push supersedes the running analysis of the same ref.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-07); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # Code scanning needs a public repository on GitHub Free.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload of the results to code scanning; nothing else is written.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0 (2026-10-15)
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default suite plus the extended security queries.
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0 (2026-10-15)
        with:
          category: /language:${{ matrix.language }}
