name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks on the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

# A new push supersedes the running checks of the same ref (Actions minutes are scarce).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-10-14); the comment names the release, and the date it was published when added
# by hand. Dependabot updates the version but not the date; its 14-day cooldown keeps the age
# rule.
jobs:
  # Docs-only pull requests skip the heavy jobs: they report « skipped », and the « CI result »
  # job below (the one check to require) passes. A push (main, or a tag through release.yml)
  # always runs everything. Only the runner's own variables are read: no event payload.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD || true)"
          fi
          if [ -z "$base" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside these paths is code: Markdown, docs/, LICENSE and issue templates are not.
          code="$(git diff --name-only "$base" HEAD | grep -vE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || true)"
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >>"$GITHUB_OUTPUT"

  lint:
    name: Workflows (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # rhysd/actionlint release v1.7.12 (2026-03-30), linux_amd64 archive. The checksum is the
      # one in the release's checksums.txt; the download is verified against it before use.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          rm "$archive"
      # actionlint runs shellcheck (preinstalled on the runner) on every run: script.
      - run: shellcheck --version && ./actionlint -color

  backend:
    name: Backend (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (2026-09-21)
        with:
          version: "0.12.18"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web (vitest, svelte-check, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run
      - run: npm run check
      - run: npm run build

  # The Playwright suite (every project, the CLS matrix and axe included) in four shards: each shard
  # runs the setup project, starts its own fresh simulator backends (playwright.config.ts) and a
  # quarter of the files, so every test runs in exactly one shard.
  web-e2e:
    name: Web e2e (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (2026-09-21)
        with:
          version: "0.12.18"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: uv sync --locked
        working-directory: backend
      - run: npx playwright install --with-deps --no-shell chromium
      # The e2e server is the backend in simulator mode (KELVIN_FAKE=1) serving web/build (built by
      # the config's webServer command).
      - run: npx playwright test --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7

  # Each shard builds and smoke-tests the image, then runs a third of the suite against a fresh
  # container. On a pull request one job runs the build, the smoke test and a critical subset
  # (login, Maison, a programme send, Énergie, axe on two routes); the full matrix runs on main
  # and on tags.
  image:
    name: Docker image (build, smoke, e2e ${{ matrix.shard == 0 && 'critical subset' || format('shard {0}/3', matrix.shard) }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[0]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - run: shellcheck scripts/docker-smoke.sh
      # Builds kelvin:smoke and checks it; the image stays for the e2e run below.
      - run: bash scripts/docker-smoke.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps --no-shell chromium
        working-directory: web
      # A fresh container (empty anonymous /data, so the e2e login creates the home's account)
      # in simulator mode, under the same hardening as the smoke test.
      - name: Start the image with the simulator
        run: |
          docker run -d --name kelvin-e2e \
            -e KELVIN_FAKE=1 \
            -p 127.0.0.1:18080:8080 \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            kelvin:smoke
          # The image's HEALTHCHECK probes /api/health: wait for it, up to 120 s.
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' kelvin-e2e)" != true ]; then
              echo "::error::kelvin-e2e exited"
              exit 1
            fi
            status="$(docker inspect -f '{{.State.Health.Status}}' kelvin-e2e)"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "::error::kelvin-e2e is not healthy after 120 s (status: $status)"
          exit 1
      - name: e2e against the container
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}
          CRITICAL: "log in with the simulator account|a deep link asks for the login|Maison loads its rooms|programme edit round-trips|shows the bill estimate, HC/HP|axe\\) (/|/energy) · no serious"
        run: |
          if [ "$SHARD" = 0 ]; then
            KELVIN_E2E_URL=http://127.0.0.1:18080 npx playwright test --project=setup --project=desktop --grep "$CRITICAL"
          else
            KELVIN_E2E_URL=http://127.0.0.1:18080 npx playwright test --shard="$SHARD/3"
          fi
      - if: failure()
        run: docker logs --tail 100 kelvin-e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: playwright-results-image-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7

  # The one check to require: green when every job passed or was skipped as docs-only.
  result:
    name: CI result
    if: always()
    needs: [changes, lint, backend, web, web-e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jobs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
