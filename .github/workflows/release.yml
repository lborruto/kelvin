name: Release

# A tag vX.Y.Z on main runs CI on the tagged commit, checks that the backend and web versions are
# the tag's and that CHANGELOG.md has its section, then pushes the multi-arch image to GHCR by
# digest only (job `publish`) with provenance and SBOM, scans that digest with Trivy in a job
# without write access (`scan`), tags it only once the scan passed (`tag`; `publish` and `tag`
# are the only jobs that may write packages), attests the image's build provenance, and creates
# the GitHub release with that version's section of CHANGELOG.md as notes. A manual run is a dry run (job `dry-run`): it
# builds both architectures, pushes nothing and holds no write permission.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# Tags queue rather than cancel one another: a cancelled run could leave an image published
# without its attestation or its release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-10-14, Trivy and the attestation on 2026-11-07); the comment names the release and
# the date it was published. Dependabot updates the version but not the date; its 14-day
# cooldown keeps the age rule. No Actions cache feeds these builds: the published image is built
# from scratch.
jobs:
  # A release is only ever made from reviewed code: the tagged commit must be on main.
  on-main:
    name: Tagged commit is on main
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Asked of GitHub's API rather than with git fetch: the checkout keeps no credentials.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # main's commit by its full branch name, so a tag called "main" cannot stand in for it.
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" -q .object.sha)"
          status="$(gh api "repos/$GH_REPO/compare/$main_sha...$GITHUB_SHA" -q .status)"
          echo "compared with main ($main_sha): $status"
          case "$status" in identical | behind) ;; *)
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main ($status)"
            exit 1 ;;
          esac

  checks:
    name: CI on the tagged commit
    needs: on-main
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The versions and the notes, checked before anything is published.
  notes:
    name: Version and notes
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: The tag matches the backend and web versions
        run: |
          tag="${TAG#v}"
          backend="$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n 1)"
          web="$(node -p "require('./web/package.json').version")"
          if [ "$tag" != "$backend" ] || [ "$tag" != "$web" ]; then
            echo "::error::tag v$tag does not match backend $backend / web $web"
            exit 1
          fi
      # The notes are the `## X.Y.Z` section of CHANGELOG.md (`## [X.Y.Z]` is read too, and a
      # heading may go on after the version: `## 0.1.0 — first public release`); a tag without
      # its section fails here, so the changelog is written before the tag.
      - name: Notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v v="$version" '
            /^## / {
              h = $0
              found = (h == "## " v || h == "## [" v "]" || index(h, "## " v " ") == 1 || index(h, "## [" v "] ") == 1)
              next
            }
            found
          ' CHANGELOG.md >"$RUNNER_TEMP/notes/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error::CHANGELOG.md has no '## $version' section; add it before tagging v$version"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 5

  # Pushed by digest only: no tag points at the image until Trivy has passed (job `tag`).
  publish:
    name: Multi-arch image to GHCR (by digest)
    needs: notes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (2026-09-15)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (2026-09-16)
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 (2026-07-02)
        env:
          # Annotate the image index too, not only each platform's manifest.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/kelvin
          # {X.Y.Z, X.Y, sha-…}; `latest` follows the newest semver tag (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Kelvin
            org.opencontainers.image.description=Self-hosted control for Sauter Cozytouch radiators (Overkiz), with Linky energy
            org.opencontainers.image.licenses=MIT
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (2026-07-29)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (2026-09-15)
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/kelvin
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

  # Trivy (a third-party action) runs in its own job, with a read-only package token: it never
  # sees the write credentials. Fixable HIGH and CRITICAL vulnerabilities fail the run, so the
  # image gets no tag, no attestation and no GitHub release.
  scan:
    name: Trivy on the pushed digest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (2026-07-29)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/kelvin@${{ needs.publish.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The scanned digest gets its tags {X.Y.Z, X.Y, sha-…, latest}. With one source, imagetools
  # create re-tags the same index: the digest, its provenance and its SBOM are unchanged.
  tag:
    name: Tag the scanned image
    needs: [publish, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (2026-09-16)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (2026-07-29)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kelvin
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAGS: ${{ needs.publish.outputs.tags }}
        run: |
          set --
          while IFS= read -r tag; do
            [ -n "$tag" ] && set -- "$@" --tag "$tag"
          done <<<"$TAGS"
          if [ "$#" -eq 0 ]; then
            echo "::error::no tag to apply"
            exit 1
          fi
          docker buildx imagetools create "$@" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"

  # A signed build-provenance attestation of the image's digest (Sigstore, stored by GitHub): who
  # built it, from which commit and workflow. The OIDC token exists only in this job, which runs
  # no code from the repository. Attestations need a public repository on GitHub Free.
  attest:
    name: Build provenance
    needs: [publish, tag]
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (2026-08-06)
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kelvin
          subject-digest: ${{ needs.publish.outputs.digest }}

  release:
    name: GitHub release
    needs: [notes, publish, tag, attest]
    # Runs when the image was scanned and tagged, and the attestation passed, or was skipped
    # (private).
    if: ${{ always() && needs.notes.result == 'success' && needs.publish.result == 'success' && needs.tag.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (2026-10-07)
        with:
          name: notes
          path: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/kelvin
          DIGEST: ${{ needs.publish.outputs.digest }}
          ATTESTED: ${{ needs.attest.result }}
        run: |
          version="${TAG#v}"
          {
            echo
            echo "---"
            echo
            echo "Image: \`$IMAGE:$version\` (\`$DIGEST\`), linux/amd64 and linux/arm64."
            if [ "$ATTESTED" = success ]; then
              echo "Check its build provenance with"
              echo "\`gh attestation verify oci://$IMAGE:$version --repo $GITHUB_REPOSITORY\`."
            fi
          } >>notes/notes.md
          set --
          case "$TAG" in *-*) set -- --prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "Kelvin $version" \
            --notes-file notes/notes.md "$@"

  dry-run:
    name: Multi-arch build (dry run, nothing pushed)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (2026-09-15)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (2026-09-16)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (2026-09-15)
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max
          sbom: true
