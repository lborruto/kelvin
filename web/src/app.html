<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <title>Kelvin</title>
    <script>
      (function () {
        /* legacy-paths:start */
        var LEGACY = [
          [/^\/pieces\/?$/, '/'],
          [/^\/pieces\/(.+)$/, '/rooms/$1'],
          [/^\/programme\/?$/, '/schedule'],
          [/^\/energie\/?$/, '/energy'],
          [/^\/maison\/?$/, '/home']
        ];
        var LEGACY_HASH = { '#tarif': '#tariff', '#absence': '#away', '#qualite': '#quality', '#courbe': '#curve', '#contenu': '#content' };
        /* legacy-paths:end */
        // Old French URLs (bookmarks, the offline PWA, typed links) become English before the
        // router reads the URL: no double render, no history entry, query kept, anchor mapped.
        var p = location.pathname;
        for (var i = 0; i < LEGACY.length; i++) {
          if (LEGACY[i][0].test(p)) {
            var h = location.hash;
            history.replaceState(null, '', p.replace(LEGACY[i][0], LEGACY[i][1]) + location.search + (LEGACY_HASH[h] || h));
            return;
          }
        }
      })();
    </script>
    <script>
      // An IIFE: no global (window.kelvinLocale, window.stored) leaks from this classic script.
      (function () {
        /* locale:start */
        function kelvinLocale(stored, languages, language) {
          if (stored === 'fr' || stored === 'en') return stored;
          var all = (languages ? Array.prototype.slice.call(languages) : []).concat(language ? [language] : []);
          for (var i = 0; i < all.length; i++) if (/^fr\b/i.test(all[i])) return 'fr';
          return language || (languages && languages.length) ? 'en' : 'fr';
        }
        /* locale:end */
        // <html lang> before first paint, so screen readers and hyphenation start right (spec §4).
        // Same rule as detectLocale ($lib/i18n/locale.ts); locale.test.ts runs both on one table.
        try {
          var stored = null;
          try {
            stored = localStorage.getItem('kelvin-locale');
          } catch (e) {}
          document.documentElement.lang = kelvinLocale(stored, navigator.languages, navigator.language);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          const t = localStorage.getItem('kelvin-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
            // Same rule as applyThemeColor ($lib/stores/theme.ts), before the app loads.
            const c = t === 'light' ? '#f5f6f8' : '#0f1115';
            for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = c;
          }
          // « Détails techniques » ($lib/stores/detail.svelte.ts): set before first paint, like the theme.
          if (localStorage.getItem('kelvin-detail') === 'on') document.documentElement.dataset.detail = 'on';
        } catch {}
      })();
    </script>
    <style>
      /* First paint before the app loads (removed by the root layout): the page ground, the
         wordmark and three card-sized blocks. A fixed overlay, so its removal moves nothing. */
      #kv-shell { position: fixed; inset: 0; z-index: 100; background: #0f1115; color: #e8eaf0;
        font: 700 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 20px 16px; }
      #kv-shell i { display: block; height: 132px; margin-top: 10px; border-radius: 10px; background: #171a21; }
      #kv-shell b { display: block; height: 22px; width: 7em; margin: 18px 0 14px; border-radius: 6px; background: #171a21; }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) #kv-shell { background: #f5f6f8; color: #14171f; }
        :root:not([data-theme='dark']) #kv-shell :is(i, b) { background: #ffffff; }
      }
      :root[data-theme='light'] #kv-shell { background: #f5f6f8; color: #14171f; }
      :root[data-theme='light'] #kv-shell :is(i, b) { background: #ffffff; }
      @media (min-width: 1024px) { #kv-shell { padding: 20px 28px 0 260px; } #kv-shell i { max-width: 640px; } }
      /* Offline first load (direction-2 §7): if the app has not started after 8 s, say why, in the page's
         language (the strings mirror m.page.unreachable and m.common.retry; app-shell.test.ts checks). */
      #kv-shell .off { display: none; margin: 18px 0 0; max-width: 420px; font-weight: 400; font-size: 13px; }
      #kv-shell.late .off { display: block; }
      #kv-shell .off button { margin-top: 12px; min-height: 36px; padding: 0 14px; border: 1px solid #262a33;
        border-radius: 8px; background: #1d212a; color: inherit; font: 600 13px system-ui, sans-serif; cursor: pointer; }
      :root[data-theme='light'] #kv-shell .off button { background: #eef0f3; border-color: #dfe2e8; }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) #kv-shell .off button { background: #eef0f3; border-color: #dfe2e8; }
      }
      html:not([lang='en']) #kv-shell [lang='en'], html[lang='en'] #kv-shell [lang='fr'] { display: none; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="kv-shell">
      <span aria-hidden="true">Kelvin<b></b><i></i><i></i><i></i></span>
      <div class="off" role="status">
        <!-- shell-offline:start -->
        <p lang="fr">Kelvin n’est pas joignable. Vérifiez la connexion à la maison (Wi-Fi ou VPN).</p>
        <p lang="en">Kelvin can’t be reached. Check your connection to home (Wi-Fi or VPN).</p>
        <button type="button" lang="fr" onclick="location.reload()">Réessayer</button>
        <button type="button" lang="en" onclick="location.reload()">Retry</button>
        <!-- shell-offline:end -->
      </div>
    </div>
    <script>
      // The app removes #kv-shell when it starts; still there after 8 s, the shell says Kelvin is unreachable.
      setTimeout(function () {
        var s = document.getElementById('kv-shell');
        if (s) s.className = 'late';
      }, 8000);
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
