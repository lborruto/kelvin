[project]
name = "kelvin"
version = "0.3.4"
description = "Kelvin — home heating control for Sauter Cozytouch radiators"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.54.0",
  "pyoverkiz==2.2.2",
  "certifi>=2026.10.19",
  "pydantic-settings>=2.6",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "mcp==2.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "asgi-lifespan>=2.1",
  "ruff>=0.7",
  "hypothesis==6.169.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kelvin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["perf: a timing smoke test with a generous bound"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
