[project]
name = "kelvin"
version = "0.3.6"
description = "Kelvin — self-hosted control for Sauter, Atlantic and Thermor radiators on Cozytouch, with Linky energy"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pyoverkiz==2.2.3",
  "certifi>=2026.10.23",
  "pydantic-settings>=2.16.2",
  "sse-starlette>=3.6.0",
  "httpx>=0.27",
  "mcp==2.3.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "asgi-lifespan>=2.1",
  "ruff>=0.17.3",
  "hypothesis==6.170.13",
  "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kelvin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["perf: a timing smoke test with a generous bound"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
